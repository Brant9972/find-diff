name: Singer quiz portraits and mobile QA
on:
  push:
    paths:
      - 'singer/roster.json'
      - 'singer/photo-review.json'
      - 'singer/prepare.py'
      - '.github/workflows/singer-quiz.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: singer-quiz-assets
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and Python syntax
        run: |
          node --check singer/game.js
          node --check singer/qa.cjs
          python -m py_compile singer/prepare.py
      - name: Install portrait processing dependencies
        run: python -m pip install requests Pillow numpy==2.2.6 opencv-python-headless==4.12.0.88 opencc-python-reimplemented
      - name: Install browser test library
        run: npm install --no-save --package-lock=false puppeteer-core@24
      - name: Download reusable portraits and align eyes
        run: python -u singer/prepare.py
      - name: Verify newly generated portrait files and real image loading
        run: node singer/qa.cjs
      - name: Save completed photo checkpoints back to GitHub
        if: always()
        run: |
          if [ -f singer/questions.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add singer/photos singer/questions.json singer/photo-report.json singer/PROGRESS.md
            if ! git diff --cached --quiet; then
              git commit -m "Checkpoint singer portraits and missing-photo report"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: singer-quiz-checkpoint
          path: |
            singer/questions.json
            singer/photo-report.json
            singer/PROGRESS.md
            singer/photos
            qa-output
          if-no-files-found: warn
