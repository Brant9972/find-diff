<style>
:root{color-scheme:dark;--bg:#0b1121;--text:#f2f5ff;--sub:#abbad3;--tile:#26324b;--active:#8061e7}

html{font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif}
body{min-height:100dvh;margin:0;color:var(--text);background:radial-gradient(ellipse 85% 42% at 15% -10%,#40326f80,transparent 75%),radial-gradient(ellipse 65% 42% at 100% 50%,#1a60704d,transparent 75%),var(--bg)}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:850;font-size:12px;letter-spacing:.12em;color:#c5adff}
.top .tag{font-size:11px;letter-spacing:0;border:1px solid #8061e7a0;padding:5px 9px;border-radius:20px}
h1{font-size:clamp(32px,8vw,44px);margin:14px 0 6px;line-height:1.1;letter-spacing:-.04em;background:linear-gradient(90deg,#fff,#cebaff 55%,#a0e8e0);color:transparent;background-clip:text}
.subtitle{color:#afbdd5;font-size:13px;line-height:1.6;margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);padding:13px 4px;background:#141f35c9;border:1px solid #ffffff1a;border-radius:16px;margin-bottom:14px}
.stat{text-align:center}.stat+.stat{border-left:1px solid #ffffff1a}
.number{display:block;font-size:21px;font-weight:850;min-height:28px;font-variant-numeric:tabular-nums}
.caption{display:block;font-size:10px;color:#a4b0c6}.hearts{color:#ffa9a3;font-size:17px}
.progress{display:flex;gap:5px;margin-bottom:15px}
.progress i{height:5px;flex:1;background:#25324b;border-radius:20px}
.progress i.on{background:linear-gradient(90deg,#a589ff,#75dcc7)}
.heading{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:800;margin-bottom:10px}
.heading span:last-child{font-size:12px;color:#b6c2d9}
.groups{display:grid;gap:7px;margin-bottom:10px}
[hidden]{display:none!important}
.hint-panel{margin:0 0 13px;padding:12px;background:linear-gradient(125deg,#2f2846,#202a45);border:1px solid #a38bf97c;border-radius:13px}
.hint-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.hint-header strong{color:#f1d8a5;font-size:13px}
.hint-header span{font-size:11px;color:#c4bde1}
.hint-items{display:grid;gap:7px}
.hint-item{font-size:13px;line-height:1.6;padding:9px 10px;border-radius:9px;background:#ffffff10;color:#f0eafc}
.hint-item strong{color:#f4d99d}
.hint-item.solved{opacity:.65}
.hint-item .solved-mark{font-size:11px;color:#b5e9d0;font-weight:750;margin-left:6px}
.group{padding:10px 8px;border-radius:11px;text-align:center;color:#1a2030;display:grid;gap:3px}
.group strong{font-size:15px}.group span{font-size:11px;font-weight:650}
.c0{background:#e8ca7c}.c1{background:#add0d8}.c2{background:#b9b0ed}.c3{background:#91d0ae}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(6px,1.7vw,10px);margin-bottom:12px}
.tile{min-width:0;min-height:clamp(59px,17vw,82px);padding:5px 2px;background:var(--tile);border:1px solid #b4c6ed1c;border-bottom:3px solid #101729aa;border-radius:12px;color:#f5f7ff;font-size:clamp(12px,3.7vw,17px);font-weight:850;line-height:1.25;transition:transform .12s,background .1s}
.tile{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}.tile.dragging{z-index:8;opacity:.9;cursor:grabbing;transition:none!important;box-shadow:0 15px 30px #0009;border-color:#dfd6ff}.tile.drop-target{outline:3px solid #90e5d4;outline-offset:-3px;background:#364662}.tile:active{transform:scale(.97)}.tile[aria-pressed=true]{background:var(--active);border-color:#d9ccff94;box-shadow:0 4px 14px #8f72ff42;transform:translateY(-2px)}
.drag-guide{display:flex;justify-content:space-between;gap:8px;margin:0 2px 9px;font-size:11px;color:#aebcda}.drag-guide strong{color:#c9b8ff}.feedback{min-height:29px;text-align:center;color:#e0d9f5;font-weight:750;font-size:12px;line-height:1.45;margin-bottom:9px}
.feedback.bad{color:#ffb0a5}.feedback.good{color:#9ce4c8}
.actions{display:grid;grid-template-columns:1fr 1fr 1.32fr;gap:8px}
.btn{border:1px solid #46516a;background:#1b2943;color:#ecf1ff;border-radius:12px;padding:12px 6px;min-height:46px;font-size:13px;font-weight:850}
.btn:disabled{opacity:.38;cursor:default}
.btn.primary{background:linear-gradient(110deg,#b49aff,#b3a4f8);color:#241744;border-color:transparent}

.note{text-align:center;color:#8898b1;font-size:11px;line-height:1.7;margin:14px 0}
.bonus-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(110deg,#253659,#242342);border:1px solid #8d87e466;border-radius:14px;padding:11px 12px;margin-bottom:14px}
.bonus-copy{min-width:0;display:grid;gap:4px}
.bonus-copy strong{font-size:13px;color:#f3e3a3}
.bonus-copy small{font-size:11px;line-height:1.5;color:#becae8}
.bonus-btn{flex-shrink:0;border:1px solid #b9a7ff;background:#5b48a3;color:#fff;border-radius:10px;padding:10px 11px;font-size:12px;font-weight:800;min-height:42px}

.extra{text-align:center}.link{border:0;background:transparent;color:#c3cce0;text-decoration:underline;font-size:12px;padding:8px}
.modalhost:empty{display:none}.overlay{position:fixed;inset:0;background:#080e1ce9;z-index:10;display:grid;place-items:center;padding:18px;overflow:auto}
.modal{background:linear-gradient(140deg,#222b47,#101c30 70%);border:1px solid #7780a34c;border-radius:20px;padding:24px 20px;max-width:440px;width:100%;text-align:center;box-shadow:0 22px 70px #0009}

.answers strong{color:#e6d6ff}.answers small{display:block;color:#c2cee5;margin-top:4px}
@media(max-width:360px){.shell{padding:14px 10px}.tile{font-size:12px;min-height:54px}.btn{font-size:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<main class="shell">
  <div class="top"><span>✦ FOUR CONNECTIONS</span><span class="tag">台灣經典特輯 · 50 關</span></div>

  <div class="stats">

  <div id="progress" class="progress"></div>
  <div class="heading"><span id="roundTitle"></span><span id="found"></span></div>
  <div id="groups" class="groups" aria-live="polite"></div>
  <section id="hintPanel" class="hint-panel" aria-label="已解鎖提示" aria-live="polite" hidden></section>
  <div class="drag-guide"><span>☝ 點一下選人</span><span><strong>⠿ 按住拖動</strong>，交換位置</span></div>
  <div id="board" class="board" aria-label="點選或拖曳名字，將四人排成一組"></div>
  <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
  <div class="actions">
    <button id="clearSelection" class="btn" type="button" disabled>✕ 取消全選</button>
    <button id="hint" class="btn" type="button">✦ 提示 −25</button>
    <button id="submit" class="btn primary" type="button" disabled>送出答案 (0/4)</button>
  </div>
  <p class="note">可自由排列方塊，整理順序不扣分。<br>正確 +100 分｜答錯 −15 分｜提示 −25 分<br>共 50 關、200 組｜自動記錄進度｜每關最多可錯 4 次。<br>新增題目可獨立補玩，不改變主線關卡與分數。</p>
  <div class="extra"><button id="restart" class="link" type="button">重新開始整個遊戲</button> · <button id="rules" class="link" type="button">遊戲規則</button></div>
</main>

 if(d.hints.length>4||new Set(d.hints).size!==d.hints.length||d.hints.some(j=>!Number.isInteger(j)||j<0||j>3))return false;
 return true;
}
function restore(){
 try{
  const d=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
  if(!validSavedState(d))return false;
  Object.assign(s,d);
  render();if(s.done)modal(s.tries===0?'lost':'win');
  say('已載入上次進度，可從第 '+(s.round+1)+' 關繼續','good');return true;
 }catch(_){return false}
}
function firstUnplayedBonus(){return BONUS_LEVELS.find(i=>!bonusCompleted.has(i))??null}
function startBonus(){
 if(bonusMode)return;
 mainSnapshot=JSON.parse(JSON.stringify(s));
 bonusMode=true;
 const saved=readBonus();
 const prior=saved&&saved.state;
 if(prior&&BONUS_LEVELS.includes(prior.round)&&validSavedState(prior)&&(!prior.done||bonusCompleted.size===BONUS_LEVELS.length)){
  Object.assign(s,prior);
  $('modalHost').replaceChildren();render();
  if(s.done)modal(s.tries===0?'lost':'win');
  else say('已返回上次的補玩題目，主線分數和進度不受影響','good');
 }else{
  s.score=prior&&Number.isFinite(prior.score)?Math.max(0,Math.floor(prior.score)):0;
  newRound(firstUnplayedBonus()??BONUS_LEVELS[0]);
  say('補玩模式已開啟：這些關卡都包含新增的偶像劇','good');
 }
}
function returnMain(){
 if(!bonusMode)return;
 bonusMode=false;
 const saved=mainSnapshot;
 mainSnapshot=null;
 $('modalHost').replaceChildren();
 if(saved&&validSavedState(saved)){
  Object.assign(s,saved);
  render();
  if(s.done)modal(s.tries===0?'lost':'win');
  else say('已回到原本的第 '+(s.round+1)+' 關；關卡與分數都保留','good');
 }else if(!restore())newRound(0);
}
function say(msg,type=''){let e=$('feedback');e.textContent=msg;e.className='feedback '+type}
function newRound(i){s.round=i;s.baseline=s.score;s.tries=4;s.selected=[];s.solved=[];s.hints=[];s.done=false;s.tiles=randomize(ROUNDS[i].groups.flatMap((g,j)=>g.names.map(n=>({id:j+':'+n,g:j,n}))));$('modalHost').replaceChildren();say('選擇 4 個你認為有共同關係的人名');render()}
function render(){
 const r=ROUNDS[s.round];$('level').textContent=bonusMode?(BONUS_LEVELS.indexOf(s.round)+1)+' / '+BONUS_LEVELS.length:(s.round+1)+' / '+ROUNDS.length;
 $('score').textContent=s.score;$('scoreCaption').textContent=bonusMode?'補玩分數':'累積分數';
 $('hearts').textContent=('♥ '.repeat(s.tries)).trim()||'—';
 $('roundTitle').textContent=bonusMode?'補玩：原第 '+(s.round+1)+' 關 · '+r.title:'第 '+(s.round+1)+' 關 · '+r.title;
 $('found').textContent='找出 '+s.solved.length+' / 4 組';
 $('bonusTitle').textContent=bonusMode?'✨ 新題補玩 · '+(BONUS_LEVELS.indexOf(s.round)+1)+' / '+BONUS_LEVELS.length:'✨ 新增題目 · 已補玩 '+bonusCompleted.size+' / '+BONUS_LEVELS.length+' 關';
 $('bonusDesc').textContent=bonusMode?'補玩完成後可隨時返回主線；補玩分數獨立記錄。':'新增《愛殺17》等 10 組戲劇，玩到後面也能回頭挑戰。';
 $('bonusToggle').textContent=bonusMode?'← 返回原本關卡':'補玩新增題目';
 $('restart').textContent=bonusMode?'重新挑戰這一題':'重新開始整個遊戲';
 $('progress').innerHTML=Array.from({length:4},(_,i)=>'<i class="'+(i<s.solved.length?'on':'')+'"></i>').join('');
 const g=$('groups');g.replaceChildren();s.solved.forEach(j=>{let el=document.createElement('div');el.className='group c'+j;let strong=document.createElement('strong'),small=document.createElement('span');strong.textContent=r.groups[j].name;small.textContent=r.groups[j].names.join(' · ');el.append(strong,small);g.append(el)});
 const panel=$('hintPanel');panel.replaceChildren();panel.hidden=s.hints.length===0;
 if(s.hints.length){
   const header=document.createElement('div');header.className='hint-header';
   const title=document.createElement('strong');title.textContent='✦ 已解鎖提示';
   const count=document.createElement('span');count.textContent=s.hints.length+' 則 · 本關持續顯示';
   header.append(title,count);panel.append(header);
   const list=document.createElement('div');list.className='hint-items';
   s.hints.forEach((j,i)=>{
     const item=document.createElement('div');item.className='hint-item'+(s.solved.includes(j)?' solved':'');
     const prefix=document.createElement('strong');prefix.textContent='提示 '+(i+1)+'｜';
     const clue=document.createElement('span');clue.textContent=r.groups[j].hint;
     item.append(prefix,clue);
     if(s.solved.includes(j)){
       const mark=document.createElement('span');mark.className='solved-mark';mark.textContent='✓ 已解出';item.append(mark);
     }
     list.append(item);
   });
   panel.append(list);
 }
 let b=$('board');b.replaceChildren();s.tiles.forEach(t=>{if(s.solved.includes(t.g))return;let e=document.createElement('button');e.type='button';e.className='tile';e.textContent=t.n;e.dataset.tileId=t.id;e.setAttribute('aria-pressed',String(s.selected.includes(t.id)));e.addEventListener('click',()=>{if(Date.now()<suppressClickUntil)return;choose(t.id)});b.append(e)});
 $('submit').disabled=s.selected.length!==4||s.done;$('submit').textContent='送出答案 ('+s.selected.length+'/4)';$('clearSelection').disabled=s.done||s.selected.length===0;$('hint').disabled=s.done||s.hints.length>=4;persist();
}
// Pointer-based drag-and-swap works with touchscreens, mice and pens.
let drag=null,suppressClickUntil=0;
const boardEl=$('board');
function targetAt(x,y){
 const rect=boardEl.getBoundingClientRect();
 if(x<rect.left-18||x>rect.right+18||y<rect.top-18||y>rect.bottom+18)return null;
 if(!drag)return null;
 const moving=drag.el,previous=moving.style.pointerEvents;
 moving.style.pointerEvents='none';
 const hit=document.elementFromPoint(x,y);
 moving.style.pointerEvents=previous;
 const tile=hit&&hit.closest('.tile');
 if(tile&&boardEl.contains(tile)&&tile!==moving)return tile.dataset.tileId;
 let nearest=null,best=Infinity;
 for(const el of boardEl.querySelectorAll('.tile')){
   if(el===moving)continue;
   const r=el.getBoundingClientRect();
   const distance=Math.hypot(x-r.left-r.width/2,y-r.top-r.height/2);
   if(distance<best){best=distance;nearest=el}
 }
 return nearest?nearest.dataset.tileId:null;
}
function markDrop(id){
 boardEl.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));
 if(id){const el=Array.from(boardEl.querySelectorAll('.tile')).find(el=>el.dataset.tileId===id);if(el)el.classList.add('drop-target')}
}
boardEl.addEventListener('pointerdown',e=>{
 if(s.done||(e.pointerType==='mouse'&&e.button!==0))return;
 const el=e.target.closest('.tile');
 if(!el||!boardEl.contains(el))return;
 drag={pointerId:e.pointerId,id:el.dataset.tileId,el,startX:e.clientX,startY:e.clientY,moving:false,targetId:null};
 try{el.setPointerCapture(e.pointerId)}catch(_){}
});
boardEl.addEventListener('pointermove',e=>{
 if(!drag||e.pointerId!==drag.pointerId)return;
 const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;
 if(!drag.moving&&Math.hypot(dx,dy)<10)return;
 if(!drag.moving){drag.moving=true;drag.el.classList.add('dragging');say('放到另一個名字上，就能交換兩人的位置')}
 drag.el.style.transform='translate('+dx+'px, '+dy+'px) scale(1.05)';
 const id=targetAt(e.clientX,e.clientY);
 if(drag.targetId!==id){drag.targetId=id;markDrop(id)}
});
function finishDrag(e,cancel=false){
 if(!drag||e.pointerId!==drag.pointerId)return;
 const d=drag;
 if(d.moving){
   suppressClickUntil=Date.now()+350;
   let target=cancel?null:targetAt(e.clientX,e.clientY);
   if(target&&target!==d.id){
     const a=s.tiles.findIndex(t=>t.id===d.id),b=s.tiles.findIndex(t=>t.id===target);
     if(a!==-1&&b!==-1){[s.tiles[a],s.tiles[b]]=[s.tiles[b],s.tiles[a]];say('已交換位置，可以繼續整理或直接選四人送出','good')}
   } else if(!cancel){say('放在其他方塊上，就能交換位置')}
 }
 drag=null;
 markDrop(null);
 if(d.moving){d.el.style.transform='';d.el.classList.remove('dragging');render()}
}
boardEl.addEventListener('pointerup',e=>finishDrag(e));
boardEl.addEventListener('pointercancel',e=>finishDrag(e,true));
function choose(id){if(s.done)return;const i=s.selected.indexOf(id);if(i>=0)s.selected.splice(i,1);else if(s.selected.length<4)s.selected.push(id);else{say('最多選 4 人，請先取消一個','bad');return}render()}
function submit(){
 if(s.selected.length!==4||s.done)return;
 let gs=s.selected.map(id=>s.tiles.find(t=>t.id===id).g),j=gs[0];
 if(gs.every(x=>x===j)){s.solved.push(j);s.score+=100;s.selected=[];say('答對！「'+ROUNDS[s.round].groups[j].name+'」','good');render();if(s.solved.length===4){s.done=true;if(bonusMode)bonusCompleted.add(s.round);render();const finishedRound=s.round,finishedMode=bonusMode;setTimeout(()=>{if(s.round===finishedRound&&bonusMode===finishedMode&&s.done)modal('win')},350)}return}
 let matches=Math.max(...[0,1,2,3].filter(x=>!s.solved.includes(x)).map(x=>gs.filter(y=>x===y).length));
 s.tries--;s.score=Math.max(0,s.score-15);s.selected=[];say(matches===3?'差一個就答對了！':'這四個人並不是同一組','bad');render();if(s.tries===0){s.done=true;render();const finishedRound=s.round,finishedMode=bonusMode;setTimeout(()=>{if(s.round===finishedRound&&bonusMode===finishedMode&&s.done)modal('lost')},350)}
}
function hint(){let j=[0,1,2,3].find(x=>!s.solved.includes(x)&&!s.hints.includes(x));if(j===undefined)return;s.hints.push(j);s.score=Math.max(0,s.score-25);render();say('已解鎖提示 '+s.hints.length+'，上方會持續顯示，不會被操作訊息覆蓋','good')}
function clearSelection(){if(s.done||s.selected.length===0)return;s.selected=[];render();say('已取消全部選取；方塊排列位置維持不變','good')}
function modal(type){
 const host=$('modalHost');host.replaceChildren();let d=document.createElement('div');d.className='overlay';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');
 let m=document.createElement('div');m.className='modal';let icon=document.createElement('div');icon.className='emoji',icon.textContent=type==='rules'?'🧩':type==='lost'?'💔':'🏆';
 let title=document.createElement('h2');title.textContent=type==='rules'?'遊戲規則':type==='lost'?'這關差一點！':bonusMode?(bonusCompleted.size===BONUS_LEVELS.length?'新增題目全部完成！':'補玩過關！'):s.round===ROUNDS.length-1?'全部通關！':'這一關過關啦！';
 let p=document.createElement('p');p.textContent=type==='rules'?'全遊戲有 50 關，每關 16 人，分成四組，每組四人。點人名可選取、再點一次可取消；長按拖動到另一張方塊上，可以交換兩人的位置，先把同組的排在一起。重新排列不扣分，已解鎖的提示會固定顯示在題目上方，不受拖曳等操作影響。答錯會少一顆愛心，每關可錯四次。取消全選不扣分，也不改變你排好的方塊順序；提示扣 25 分。':type==='lost'?'四次失誤已用完。下面是本關正確分組。':bonusMode?(bonusCompleted.size===BONUS_LEVELS.length?'這次新增的 10 組戲劇都體驗過了！主線進度與分數完全保留。':'已完成這道新增題目！補玩不會更改原本關卡與分數。'):s.round===ROUNDS.length-1?'50 關全部完成，200 組關聯都被你找出來了！':'太棒了，準備挑戰下一個主題！';m.append(icon,title,p);
 if(type==='win'){let sc=document.createElement('div');sc.className='score';sc.textContent=s.score+' 分';m.append(sc)}
 if(type==='lost'){let a=document.createElement('div');a.className='answers';ROUNDS[s.round].groups.forEach(g=>{let row=document.createElement('div');let strong=document.createElement('strong'),small=document.createElement('small');strong.textContent=g.name;small.textContent=g.names.join(' · ');row.append(strong,small);a.append(row)});m.append(a)}
 let btn=document.createElement('button');btn.type='button';btn.className='btn primary wide';btn.textContent=type==='rules'?'返回題目':type==='lost'?'重新挑戰這關':bonusMode?(firstUnplayedBonus()===null?'返回原本關卡':'挑戰下一個補玩關卡'):s.round===ROUNDS.length-1?'再玩一次':'挑戰下一關';
 btn.addEventListener('click',()=>{if(type==='rules'){host.replaceChildren();return}if(type==='lost'){s.score=s.baseline;newRound(s.round)}else if(bonusMode){const next=firstUnplayedBonus();if(next===null)returnMain();else newRound(next)}else if(s.round===ROUNDS.length-1){s.score=0;newRound(0)}else newRound(s.round+1)});m.append(btn);
 if(bonusMode&&type!=='rules'){
  let back=document.createElement('button');back.type='button';back.className='btn wide';back.textContent='← 返回原本進度';back.addEventListener('click',returnMain);m.append(back);
 }
 d.append(m);host.append(d);if(type==='rules')d.addEventListener('click',e=>{if(e.target===d)host.replaceChildren()});btn.focus()
}
$('submit').addEventListener('click',submit);$('hint').addEventListener('click',hint);$('clearSelection').addEventListener('click',clearSelection);$('rules').addEventListener('click',()=>modal('rules'));$('bonusToggle').addEventListener('click',()=>bonusMode?returnMain():startBonus());$('restart').addEventListener('click',()=>{if(bonusMode){s.score=s.baseline;newRound(s.round)}else{s.score=0;newRound(0)}});document.addEventListener('keydown',e=>{if($('modalHost').childElementCount)return;if(e.key==='Enter'&&s.selected.length===4)submit();if(e.key==='Escape'){s.selected=[];render()}});function migrateLegacy(){
 try{
  for(const key of LEGACY_STORAGE_KEYS){
   const old=JSON.parse(localStorage.getItem(key)||'null');
   if(!old||!Number.isInteger(old.round)||old.round<0||old.round>=ROUNDS.length||!Number.isFinite(old.score))continue;
   s.score=Math.max(0,Math.floor(old.score));newRound(old.round);
   say('已保留舊版第 '+(old.round+1)+' 關與分數；本關換新題組，請重新作答','good');
   return true;
  }
  return false;
 }catch(_){return false}
}
if(!restore()&&!migrateLegacy())newRound(0);
</script>
