name: Curated Commons video still diagnostic (research only)
on:
  push:
    branches:
      - automation/celebrity-photo-pipeline
    paths:
      - .github/workflows/curated-video-frame-diagnostic.yml
      - singer/expansion-1500/tools/curated_video_frames.py
      - singer/expansion-1500/pipeline/curated-video-source-leads-20261102.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curated-video-frame-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract-curated-stills:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded diagnostic dependencies
        run: |
          python -m pip install requests==2.32.5 Pillow==12.0.0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Extract up to seven unapproved frames from one exact Commons video
        run: |
          python singer/expansion-1500/tools/curated_video_frames.py \
            --person-id t1500_0094 \
            --download \
            --out "${{ runner.temp }}/curated-video-review"
      - name: Upload only unapproved stills and SHA manifest (never source video)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curated-video-t1500-0094-unapproved-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/curated-video-review/t1500_0094/manifest.json
            ${{ runner.temp }}/curated-video-review/t1500_0094/contact-sheet.jpg
            ${{ runner.temp }}/curated-video-review/t1500_0094/frame-*.jpg
          if-no-files-found: warn
          retention-days: 3
