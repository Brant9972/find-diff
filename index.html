<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101525"><title>眼力特搜隊｜100 關找碴</title><style>

/* Dense-scene extreme difficulty engine; synchronized 2x mobile zoom. */
.scene{overflow:hidden;touch-action:manipulation}
.scene .stage{position:relative;width:100%}
.scene .stage svg{display:block;width:100%;height:auto;aspect-ratio:420/260}
.scene .spots{position:absolute;inset:0;pointer-events:none}
.scene.zoomed{overflow:auto;max-height:min(45vh,265px);touch-action:pan-x pan-y;overscroll-behavior:contain}
.scene.zoomed .stage{width:200%}

.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.actions .btn{font-size:12px;padding:12px 4px;white-space:nowrap;min-width:0}
@media(max-width:420px){.actions{grid-template-columns:repeat(2,minmax(0,1fr))}.actions .btn{font-size:14px;padding:11px 5px}}
</style></head><body><main class="app"><header class="top"><div class="logo">👀 眼力<span>特搜隊</span></div><button class="pill" id="levelsBtn">🗺️ 選關</button></header><p class="intro" id="subtitle">地獄級 100 關：五處極細微差異，手機可放大 2×！</p><div class="status"><div class="stat"><small>關卡</small><strong id="lv">001 / 100</strong></div><div class="stat"><small>找到</small><strong id="found">0 / 5</strong></div><div class="stat"><small>剩餘時間</small><strong id="time">90</strong></div></div><div class="progress"><div id="bar"></div></div><section class="scene-wrap"><div class="scene-head"><span>🔍 圖片 A</span><span id="title">海邊假日</span></div><div class="scene" id="sceneA"><div class="spots" id="spotsA"></div></div></section><section class="scene-wrap"><div class="scene-head"><span>🔎 圖片 B</span><span>尋找 5 個不同處</span></div><div class="scene" id="sceneB"><div class="spots" id="spotsB"></div></div></section><div class="actions"><button class="btn" id="zoomBtn">🔎 放大 2×</button><button class="btn" id="hintBtn">💡 提示（3）</button><button class="btn" id="pauseBtn">⏸ 暫停</button><button class="btn main" id="retryBtn">↻ 重玩</button></div><div class="message" id="msg" role="status"></div><div class="footer">高密度眼力挑戰 · 點錯扣 6 秒 · 進度自動儲存</div></main><div class="modal" id="modal"><div class="dialog"><div class="emoji" id="modalEmoji">🕵️</div><h1 id="modalTitle">眼力特搜隊</h1><p id="modalText">每一關只有 5 個不同。左右不用比，直接上下對照，找到就點下去！</p><div id="levelPicker" class="levelgrid" hidden></div><button id="modalMain" class="bigbtn">開始挑戰！</button><button id="modalSecond" class="mini" hidden>返回</button></div></div>
