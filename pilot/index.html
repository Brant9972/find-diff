<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a25">
<title>眼力特搜隊｜盲測實驗室</title>
<style>
:root{color-scheme:dark;--bg:#0b1420;--paper:#152639;--border:#2e4960;--text:#f4f4ee;--mute:#a6bbc9;--gold:#ffda86;--mint:#81e7d0;--warn:#ff937f}*{box-sizing:border-box}body{margin:0;color:var(--text);background:radial-gradient(ellipse 120% 45% at 50% -12%,#263b55 2%,#0b1420 77%);font-family:ui-rounded,system-ui,-apple-system,"Noto Sans TC",sans-serif;-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.37;cursor:not-allowed}main{width:min(740px,100%);margin:auto;padding:10px 12px max(26px,env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.brand{font-size:20px;font-weight:950;letter-spacing:.6px}.brand b{color:var(--gold)}.micro{display:block;color:var(--mute);font-size:11px;letter-spacing:2px;font-weight:700;margin-top:3px}.outline{border:1px solid var(--border);background:#22344a;color:var(--text);padding:10px 14px;border-radius:13px;font-weight:800}.level-title{font-size:15px;font-weight:900;line-height:1.4}.level-sub{margin-top:3px;color:var(--mute);font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0 9px}.stat{border:1px solid var(--border);background:var(--paper);border-radius:13px;text-align:center;padding:7px}.stat small{font-size:10px;color:var(--mute);display:block}.stat strong{font-size:20px;font-variant-numeric:tabular-nums}.dots{display:flex;gap:7px;margin:0 1px 10px}.dot{height:5px;border-radius:6px;background:#395268;flex:1;transition:background .22s}.dot.done{background:var(--mint)}.scene-head{display:flex;justify-content:space-between;color:var(--mute);font-size:11px;letter-spacing:.5px;font-weight:850;margin:5px 4px}.scene-head b{color:#f7ddac}.scene-frame{border:2px solid #4b6880;border-radius:12px;background:#26394b;box-shadow:0 6px 18px #0006;overflow:auto;overscroll-behavior:contain;touch-action:pan-x pan-y;margin-bottom:9px;position:relative;scrollbar-width:thin;scrollbar-color:#647a8b transparent}.scene-frame .stage{position:relative;width:100%;min-width:0;user-select:none;-webkit-user-select:none}.scene-frame.zoom .stage{width:200%}.scene-frame.zoom{max-height:260px}.stage svg{display:block;width:100%;height:auto;aspect-ratio:800 / 460}.rings{pointer-events:none;position:absolute;inset:0}.ring{position:absolute;transform:translate(-50%,-50%);width:9%;aspect-ratio:1;border-radius:50%;border:2.8px solid #72ffe0;box-shadow:0 0 0 2px #152739aa,0 0 16px #55ffbb66;background:#56f6cb21;animation:pop .22s ease-out}.ring.hint{border:3px solid #ffdd72;box-shadow:0 0 13px 3px #ffbf53;animation:pulse .55s ease-in-out infinite alternate}.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:12px 0 6px}.btn{border:1px solid #415c71;border-radius:12px;background:#263b51;color:var(--text);font-size:12px;font-weight:850;padding:11px 5px;min-width:0}.btn.primary{background:var(--gold);color:#352b26;border-color:var(--gold)}.message{min-height:28px;margin:7px 0;color:var(--gold);font-weight:700;text-align:center;font-size:12px}.foot{text-align:center;color:#8098aa;font-size:11px;padding-top:7px}.overlay{position:fixed;inset:0;background:#07101de9;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;overflow:auto}.overlay[hidden]{display:none}.dialog{width:min(430px,100%);background:linear-gradient(135deg,#284059,#122337);border:1px solid #577186;border-radius:23px;padding:25px 20px;text-align:center;box-shadow:0 24px 70px #000c}.hero{font-size:45px;margin:0}.dialog h1{font-size:24px;margin:9px 0}.dialog p{font-size:14px;line-height:1.75;color:#c6d6e0;margin:12px 0 17px}.dialog .start{width:100%;padding:13px;border:0;border-radius:13px;background:var(--gold);color:#302a2a;font-weight:950;font-size:16px}.dialog .sub{border:0;color:var(--mint);font-size:13px;background:transparent;margin-top:15px;font-weight:800}.level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:14px 0;max-height:38vh;overflow:auto}.level-grid[hidden]{display:none}.level-grid button{padding:12px 0;border:1px solid #56718a;background:#263f57;border-radius:9px;color:white;font-weight:900}.level-grid button.active{background:var(--gold);color:#273042}.level-grid button.locked{opacity:.33}.shake{animation:shake .27s ease}@keyframes shake{0%,100%{transform:translateX(0)}28%{transform:translateX(-4px)}70%{transform:translateX(4px)}}@keyframes pop{from{scale:.45;opacity:.2}to{scale:1;opacity:1}}@keyframes pulse{to{scale:1.18}}@media(max-width:440px){.brand{font-size:18px}.actions{grid-template-columns:repeat(2,minmax(0,1fr))}.btn{font-size:13px;padding:11px 5px}.scene-frame.zoom{max-height:223px}.stats{margin:9px 0 7px}.level-title{font-size:14px}}
</style>
</head><body><main>
<header class="top"><div class="brand">👀 眼力<b>特搜隊</b><small class="micro">BLIND TEST · 10 STAGES</small></div><button id="mapBtn" class="outline">▦ 選關</button></header>
<div class="level-title" id="sceneTitle">試玩實驗室</div><div id="sceneSub" class="level-sub">10 張獨立構圖，逐關盲測</div>
<div class="stats"><div class="stat"><small>關卡</small><strong id="level">01 / 10</strong></div><div class="stat"><small>找到了</small><strong id="count">0 / 5</strong></div><div class="stat"><small>倒數</small><strong id="seconds">150</strong></div></div>
<div class="dots" id="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
<div class="scene-head"><b>圖片 A</b><span>原圖</span></div><div id="frameA" class="scene-frame"><div class="stage" id="stageA"></div></div>
<div class="scene-head"><b>圖片 B</b><span>找出 5 個不同</span></div><div id="frameB" class="scene-frame"><div class="stage" id="stageB"></div></div>
<div class="actions"><button class="btn primary" id="zoomBtn">⌕ 放大 2×</button><button class="btn" id="hintBtn">💡 提示 2</button><button class="btn" id="pauseBtn">⏸ 暫停</button><button class="btn" id="restartBtn">↻ 重玩</button></div>
<div id="message" class="message" role="status"></div><footer class="foot">不同點分散在整幅畫中 · 雙圖同步放大 · 進度僅儲存在這支手機</footer>
</main>
<div class="overlay" id="overlay"><div class="dialog"><div id="emoji" class="hero">👀</div><h1 id="modalTitle">找碴盲測</h1><p id="modalText"></p><div class="level-grid" id="levelGrid" hidden></div><button id="modalGo" class="start">開始</button><button id="modalAlt" class="sub" hidden>回到遊戲</button></div></div>
<script src="./scenes.js?v=1"></script><script src="./scenes-more.js?v=1"></script><script src="./game.js?v=1"></script></body></html>
