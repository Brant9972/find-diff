name: Celebrity bulk photos and direct visual review (no deploy)
on:
  push:
    branches: [automation/celebrity-photo-pipeline]
    paths:
      - singer/expansion-1500/pipeline/batch-request.json
      - singer/expansion-1500/pipeline/chatgpt-review/latest.json
  workflow_dispatch:
    inputs:
      limit:
        description: People to search in one batch (30..50 recommended)
        type: number
        default: 40
  schedule:
    - cron: '20 18 * * *'
permissions:
  contents: read
concurrency:
  group: celebrity-photo-pipeline
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/automation/celebrity-photo-pipeline' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/celebrity-photo-pipeline
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r singer/expansion-1500/requirements-media.txt
      - name: Test batching, image pixels and review protections
        run: python -m unittest discover -s singer/expansion-1500/tests -q
      - run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - run: git rev-parse HEAD > /tmp/media-source-commit.txt
      - name: Collect a single 40-person batch, then build review assets once
        env:
          REQUEST_LIMIT: ${{ inputs.limit || '40' }}
        run: |
          set -euo pipefail
          python singer/expansion-1500/prepare_media.py --limit "$REQUEST_LIMIT" --workers 1 --max-minutes 25 --person-seconds 90 --live-ref origin/main
      - run: python singer/expansion-1500/validate_pipeline.py
      - name: Assert only draft outputs changed
        if: always()
        run: |
          python - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert all(p.startswith('singer/expansion-1500/pipeline/') for p in changed),changed
          assert 'singer/expansion-1500/pipeline/chatgpt-review/latest.json' not in changed
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: celebrity-review-${{ github.run_id }}
          retention-days: 30
          path: |
            singer/expansion-1500/pipeline
            /tmp/media-source-commit.txt
          if-no-files-found: error
  checkpoint:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/celebrity-photo-pipeline
      - uses: actions/download-artifact@v4
        with:
          name: celebrity-review-${{ github.run_id }}
          path: /tmp/media-review
      - run: python -m pip install Pillow==12.0.0
      - name: Commit assets, then pin public image links to that exact asset commit
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'automation/celebrity-photo-pipeline'
          saved=$(find /tmp/media-review -name media-source-commit.txt -type f)
          test "$(git rev-parse HEAD)" = "$(cat "$saved")"
          generated=$(find /tmp/media-review -type d -path '*/expansion-1500/pipeline')
          test -n "$generated"
          cp -a "$generated/." singer/expansion-1500/pipeline/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- singer/expansion-1500/pipeline
          python - <<'PY'
          import subprocess
          files=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert all(p.startswith('singer/expansion-1500/pipeline/') for p in files),files
          assert 'singer/expansion-1500/pipeline/chatgpt-review/latest.json' not in files
          PY
          git commit -m 'Checkpoint one bulk batch of unapproved photos and visual assets'
          asset_commit=$(git rev-parse HEAD)
          python singer/expansion-1500/tools/publish_review_links.py --asset-commit "$asset_commit"
          git add -- singer/expansion-1500/pipeline/review-public singer/expansion-1500/pipeline/codex-response/latest.json
          git commit -m 'Publish immutable GitHub image links for ChatGPT review'
          git push origin HEAD:refs/heads/automation/celebrity-photo-pipeline
