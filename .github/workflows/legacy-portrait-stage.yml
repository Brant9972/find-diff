name: Legacy Commons portrait source staging (no deploy)
on:
  push:
    branches:
      - automation/celebrity-photo-pipeline
    paths:
      - singer/expansion-1500/pipeline/legacy-portrait-request.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/celebrity-photo-pipeline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and request validation dependencies
        run: python -m pip install -r singer/expansion-1500/requirements-media.txt
      - name: Verify exact Commons original and stage unapproved crop and masks
        run: |
          python singer/expansion-1500/media_pipeline/legacy_source_stage.py \
            singer/expansion-1500/pipeline/legacy-portrait-request.json \
            /tmp/legacy-review
      - name: Upload original pixels, draft and evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-vanness-source-draft-${{ github.run_id }}
          path: /tmp/legacy-review/
          retention-days: 30
          if-no-files-found: warn
      - name: Assert production tree untouched
        if: always()
        run: |
          test -z "$(git status --porcelain -- singer/questions.json singer/actors.json singer/variety.json singer/photos singer/creators.json)"
