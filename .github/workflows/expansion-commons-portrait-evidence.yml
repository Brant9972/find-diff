name: Expansion 1500 reusable Commons portrait evidence
on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: 'Existing expansion-1500 plannedQuestionId'
        required: true
        type: string
      commons_title:
        description: 'Exact Commons File: title'
        required: true
        type: string
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact source and create review-only evidence
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          COMMONS_TITLE: ${{ inputs.commons_title }}
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          import io,json,os,re,html,time,pathlib,hashlib,urllib.parse,urllib.request,urllib.error
          from PIL import Image,ImageOps
          root=pathlib.Path('singer')
          plan=json.loads((root/'expansion-1500/release-plan-20261028.json').read_text())
          cid=os.environ['CANDIDATE_ID'].strip()
          matches=[p for k in ('selectedNew','backup','deferred') for p in plan.get(k,[]) if isinstance(p,dict) and p.get('plannedQuestionId')==cid]
          assert len(matches)==1,'Candidate must be uniquely present in existing expansion plan'
          live=[q for fn in ('questions.json','actors.json','variety.json') for q in json.loads((root/fn).read_text())['questions']]
          # Check all live banks before fetching any image; an alias or QID collision
          # is the same person even when a different question ID was assigned.
          def norm(v):
              return re.sub(r'[\s\u3000·・.．_-]+','',str(v or '')).casefold()
          # Regression: whitespace and ideographic spaces must normalize, while distinct names stay distinct.
          assert norm('葉 佳修')==norm('葉佳修')==norm('葉　佳修')
          assert norm('家家')!=norm('家家美食') and norm('黃玠')!=norm('黃玠瑋')
          planned=matches[0]
          candidate_names={norm(v) for v in [planned.get('name'),*(planned.get('aliases') or []),*(planned.get('acceptedAnswers') or [])] if norm(v)}
          candidate_qid=planned.get('wikidataQid') or planned.get('wikidataQID') or planned.get('wikidataId')
          for q in live:
              assert q.get('id')!=cid,'Candidate ID already live'
              live_names={norm(v) for v in [q.get('name'),*(q.get('aliases') or [])] if norm(v)}
              assert not candidate_names.intersection(live_names),f"Existing live name/alias collision: {q.get('id')} ({q.get('name')})"
              live_qid=q.get('wikidataQid') or q.get('wikidataQID') or q.get('wikidataId')
              assert not (candidate_qid and live_qid and candidate_qid==live_qid),f"Existing live Wikidata QID collision: {q.get('id')}"
          title=os.environ['COMMONS_TITLE'].strip()
          assert title.startswith('File:') and len(title)<220 and not any(c in title for c in '\r\n'),'Exact Commons File: title required'
          headers={'User-Agent':'FindDiffExpansionEvidence/1.0 (https://github.com/Brant9972/find-diff)'}
          def fetch(url):
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=40) as resp:return resp.read()
                  except (urllib.error.HTTPError,urllib.error.URLError,TimeoutError):
                      if attempt==3:raise
                      time.sleep(2**attempt*3)
          params=urllib.parse.urlencode({'action':'query','format':'json','prop':'imageinfo','iiprop':'url|size|mime|extmetadata','titles':title})
          pages=json.loads(fetch('https://commons.wikimedia.org/w/api.php?'+params))['query']['pages']
          info=next((p['imageinfo'][0] for p in pages.values() if p.get('imageinfo')),None)
          assert info and info.get('mime','').startswith('image/'),'Commons source must be an image'
          md=info.get('extmetadata',{})
          def field(k):return re.sub('<[^>]+>',' ',html.unescape(md.get(k,{}).get('value',''))).strip()
          license=field('LicenseShortName')
          artist=field('Artist')
          assert license and artist,'Missing rights metadata: manual review required'
          raw=fetch(info['url'])
          assert len(raw)<=25_000_000,'Image too large for evidence job'
          im=Image.open(io.BytesIO(raw));im.load()
          assert im.width>=400 and im.height>=500,'Insufficient source resolution'
          im=ImageOps.exif_transpose(im).convert('RGB')
          out=pathlib.Path('portrait-evidence');out.mkdir(exist_ok=True)
          im.save(out/'original-preview.jpg',quality=90)
          crop=ImageOps.fit(im,(600,720),method=Image.Resampling.LANCZOS,centering=(0.5,0.42))
          crop.save(out/'provisional-600x720.jpg',quality=92)
          sheet=Image.new('RGB',(1220,760),'white')
          sheet.paste(ImageOps.contain(im,(560,720)),(20,20))
          sheet.paste(crop,(600,20))
          sheet.save(out/'contact-sheet.jpg',quality=90)
          report={'candidateId':cid,'candidateName':matches[0].get('name'),'commonsTitle':title,'commonsPage':'https://commons.wikimedia.org/wiki/'+urllib.parse.quote(title.replace(' ','_')),'sourceUrl':info['url'],'artist':artist,'license':license,'licenseUrl':field('LicenseUrl'),'credit':field('Credit'),'description':field('ImageDescription'),'usageTerms':field('UsageTerms'),'width':im.width,'height':im.height,'sha256':hashlib.sha256(raw).hexdigest(),'status':'EVIDENCE_ONLY_NOT_APPROVED','reviewRequired':['identity and caption','author and crop license','single unobstructed face','eyes nose mouth chin full-face visual stages','work hint and deduplication']}
          (out/'metadata.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print('SOURCE EVIDENCE ONLY',json.dumps({'id':cid,'title':title,'license':license,'size':[im.width,im.height]},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: expansion-commons-evidence
          path: portrait-evidence/
          retention-days: 14
