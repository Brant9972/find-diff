name: Prepare external actor photo candidates
on:
  push:
    branches:
      - photo-prep-actors-batch-01-20261022
    paths:
      - singer/photo-prep/external-photo-sources.json
      - singer/photo-prep/prepare_external_candidates.py
      - .github/workflows/prepare-external-photos.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare-external:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q Pillow 'numpy<2' 'opencv-python-headless==4.10.0.84'
      - name: Download image candidates from curated source URLs
        run: |
          python singer/photo-prep/prepare_external_candidates.py \
            --manifest singer/photo-prep/external-photo-sources.json \
            --out actor-external-candidates
      - name: Upload candidate-only artifacts for reviewer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-actor-photo-review
          path: actor-external-candidates/
          if-no-files-found: warn
          retention-days: 14
