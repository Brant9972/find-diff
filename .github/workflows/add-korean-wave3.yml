name: Add Korean drama actors wave 3
on:
  push:
    paths:
      - 'singer/korean-wave3-20261108.json'
      - '.github/workflows/add-korean-wave3.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quiz-batch
  cancel-in-progress: false
jobs:
  prepare-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install licensed portrait processing
        run: python -m pip install requests Pillow numpy==2.2.6 opencv-python-headless==4.12.0.88 opencc-python-reimplemented
      - run: npm install --no-save --package-lock=false puppeteer-core@24
      - name: Prepare individual portrait and source records
        run: python -u singer/import_korean_wave2_20261108.py
      - name: Run hint index and game regression tests
        run: |
          python singer/prepare_hints.py
          node singer/qa.cjs
      - name: Commit only tested ready entries, keep pending candidates in review file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add singer/actors.json singer/questions.json singer/variety.json singer/hints.json singer/hint-candidates.json singer/eligibility-review.json
          git add singer/actors-roster.json singer/roster.json singer/variety-roster.json
          git add singer/photos singer/batches/korean-wave3-20261108-review.json singer/batches/korean-wave3-20261108-portraits.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add Korean wave 3 actors with source and playable QA"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korean-wave3-review
          path: |
            singer/batches/korean-wave3-20261108-review.json
            singer/batches/korean-wave3-20261108-portraits.jpg
