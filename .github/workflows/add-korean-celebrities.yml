name: Add requested Korean quiz celebrities
on:
  push:
    paths:
      - 'singer/korean-20261108.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quiz-batch
  cancel-in-progress: false
jobs:
  prepare-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install requests Pillow numpy==2.2.6 opencv-python-headless==4.12.0.88 opencc-python-reimplemented
      - run: npm install --no-save --package-lock=false puppeteer-core@24
      - name: Prepare licensed, face-detected celebrity portraits
        run: python -u singer/import_korean_20261108.py
      - name: Regression test playable banks
        run: node singer/qa.cjs
      # Automated face detection is not human approval; never publish to main here.
      - name: Commit tested data to a human-review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add singer/actors.json singer/questions.json singer/variety.json singer/hints.json singer/eligibility-review.json
          git add singer/actors-roster.json singer/roster.json singer/variety-roster.json
          git add singer/photos singer/batches/korean-20261108-review.json singer/batches/korean-20261108-portraits.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add verified Korean celebrity portraits and quiz hints"
            git push origin HEAD:refs/heads/automation/korean-review-${{ github.run_id }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korean-celebrity-review
          path: |
            singer/batches/korean-20261108-review.json
            singer/batches/korean-20261108-portraits.jpg
