name: Expansion 1500 Wikidata P18 portrait source probe
on:
  push:
    paths:
      - '.github/workflows/expansion-p18-source-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Probe unpublished planned people using Wikidata P18 and Commons metadata
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request, urllib.parse, urllib.error, time, re, html
          root=pathlib.Path('singer')
          plan=json.loads((root/'expansion-1500/release-plan-20261028.json').read_text())
          live=[]
          for f in ('questions.json','actors.json','variety.json'):
              live+=json.loads((root/f).read_text())['questions']
          ids={str(p.get('id','')) for p in live}
          names={str(p.get('name','')).strip().casefold() for p in live}
          candidates=[p for p in plan['selectedNew'] if p.get('plannedQuestionId') not in ids and p.get('name','').strip().casefold() not in names and p.get('photoStatus')!='published']
          candidates=candidates[:12]
          headers={'User-Agent':'FindDiffExpansionP18Probe/1.0 (github.com/Brant9972/find-diff; metadata-only)'}
          def api(host, params):
              url=host+'?'+urllib.parse.urlencode(params)
              for i in range(4):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=25) as r:
                          return json.load(r)
                  except (urllib.error.HTTPError,urllib.error.URLError,TimeoutError) as e:
                      if i==3: return {'error':str(e)}
                      time.sleep(3*(i+1))
          report=[]
          for p in candidates:
              name=p['name']
              row={'id':p['plannedQuestionId'],'name':name,'status':'unverified','candidates':[]}
              search=api('https://www.wikidata.org/w/api.php',dict(action='wbsearchentities',search=name,language='zh',uselang='zh',format='json',limit=5))
              for hit in search.get('search',[]):
                  qid=hit['id']
                  entity=api('https://www.wikidata.org/w/api.php',dict(action='wbgetentities',ids=qid,props='claims|labels|descriptions',languages='zh|en',format='json'))
                  e=entity.get('entities',{}).get(qid,{})
                  occupation=[x.get('mainsnak',{}).get('datavalue',{}).get('value',{}).get('id') for x in e.get('claims',{}).get('P106',[])]
                  for claim in e.get('claims',{}).get('P18',[])[:2]:
                      title=claim.get('mainsnak',{}).get('datavalue',{}).get('value')
                      if not isinstance(title,str):continue
                      commons=api('https://commons.wikimedia.org/w/api.php',dict(action='query',format='json',prop='imageinfo',iiprop='url|size|mime|extmetadata',titles='File:'+title))
                      pages=commons.get('query',{}).get('pages',{})
                      info=next((v['imageinfo'][0] for v in pages.values() if v.get('imageinfo')),None)
                      if not info:continue
                      m=info.get('extmetadata',{})
                      get=lambda key:re.sub('<[^>]*>',' ',html.unescape(m.get(key,{}).get('value',''))).strip()[:600]
                      row['candidates'].append({'qid':qid,'wikidataDescription':hit.get('description',''),'occupationQids':occupation,'commonsTitle':title,'commonsPage':'https://commons.wikimedia.org/wiki/File:'+urllib.parse.quote(title.replace(' ','_')),'license':get('LicenseShortName'),'licenseUrl':get('LicenseUrl'),'artist':get('Artist'),'credit':get('Credit'),'usageTerms':get('UsageTerms'),'mime':info.get('mime'),'width':info.get('width'),'height':info.get('height'),'sourceUrl':info.get('url'),'warning':'NOT identity/rights/crop approved; manual verification mandatory'})
              row['status']='metadata_candidates_only' if row['candidates'] else 'no_verified_p18_source'
              report.append(row)
              print(row['id'],name,row['status'],len(row['candidates']),flush=True)
          out=pathlib.Path('p18-source-probe.json')
          out.write_text(json.dumps({'mainCommit':'${{ github.sha }}','entries':report,'note':'Metadata only. No photo or person is approved; cross-bank alias/QID, source caption, rights and five-stage manual review required.'},ensure_ascii=False,indent=2))
          print('PROBE SUMMARY',json.dumps({'people':len(report),'withP18':sum(bool(r['candidates']) for r in report)},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: expansion-p18-source-probe
          path: p18-source-probe.json
          retention-days: 14
