name: Expansion 1500 two verified-source portrait review
on:
  push:
    paths:
      - '.github/workflows/expansion-two-portrait-review.yml'
  pull_request:
    paths:
      - '.github/workflows/expansion-two-portrait-review.yml'
  workflow_dispatch:
    inputs:
      person_id:
        description: 'Existing expansion-1500 candidate ID'
        required: true
        type: string
      person_name:
        description: 'Candidate name for the review report'
        required: true
        type: string
      commons_file:
        description: 'Exact Commons File: title, manually checked against candidate identity'
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - name: Validate workflow script syntax on push
        if: github.event_name != 'workflow_dispatch'
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/expansion-two-portrait-review.yml').read_text()
          lines = source.splitlines()
          marker = '      - name: Download exact Commons originals and prepare visual review'
          start = next(i for i, line in enumerate(lines) if line == marker)
          script_start = next(i for i in range(start + 1, len(lines)) if lines[i].startswith('          import json, pathlib, urllib.parse, urllib.request, re,'))
          script_end = next(i for i in range(script_start + 1, len(lines)) if lines[i] == '          PY')
          body = '\n'.join(line[10:] for line in lines[script_start:script_end])
          compile(body, '<portrait-review>', 'exec')
          print('Portrait review Python syntax PASS')
          PY
      - name: Download exact Commons originals and prepare visual review
        if: github.event_name == 'workflow_dispatch'
        env:
          PERSON_ID: ${{ inputs.person_id }}
          PERSON_NAME: ${{ inputs.person_name }}
          COMMONS_FILE: ${{ inputs.commons_file }}
        run: |
          python - <<'PY'
          import json, pathlib, urllib.parse, urllib.request, re, html, hashlib, io, os
          from PIL import Image,ImageOps,ImageDraw
          out=pathlib.Path('portrait-review');out.mkdir()
          entries=[(os.environ['PERSON_ID'],os.environ['PERSON_NAME'],os.environ['COMMONS_FILE'])]
          if not re.fullmatch(r't1500_\d{4}', entries[0][0]): raise SystemExit('Invalid expansion ID')
          if not entries[0][2].startswith('File:'): raise SystemExit('Expected exact Commons File: title')
          report=[]
          for pid,name,title in entries:
              row={'id':pid,'name':name,'commonsTitle':title,'approved':False}
              try:
                  url='https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode({'action':'query','format':'json','prop':'imageinfo','iiprop':'url|size|mime|extmetadata','titles':title})
                  headers={'User-Agent':'FindDiffPortraitReview/1.0 (github.com/Brant9972/find-diff; license and visual audit)'}
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=35) as response:data=json.load(response)
                  page=next(iter(data['query']['pages'].values()))
                  info=page['imageinfo'][0]
                  ext=info.get('extmetadata',{})
                  clean=lambda k:re.sub('<[^>]+>',' ',html.unescape(ext.get(k,{}).get('value',''))).strip()
                  for key in ['LicenseShortName','LicenseUrl','Artist','Credit','ImageDescription','ObjectName','UsageTerms','AttributionRequired']:
                      row[key]=clean(key)
                  row['sourceUrl']=info['url']
                  row['commonsPage']='https://commons.wikimedia.org/wiki/'+urllib.parse.quote(title.replace(' ','_'))
                  with urllib.request.urlopen(urllib.request.Request(info['url'],headers=headers),timeout=50) as response: raw=response.read(18_000_000)
                  row['sha256']=hashlib.sha256(raw).hexdigest()
                  image=Image.open(io.BytesIO(raw));image.load()
                  row['originalSize']=list(image.size)
                  image=ImageOps.exif_transpose(image).convert('RGB')
                  image.thumbnail((900,1080))
                  image.save(out/(pid+'-source.jpg'),quality=88)
                  # CENTER crop is only a review proposal, never an approved game image
                  original=ImageOps.exif_transpose(Image.open(io.BytesIO(raw))).convert('RGB')
                  proposal=ImageOps.fit(original,(600,720),method=Image.Resampling.LANCZOS,centering=(.5,.4))
                  proposal.save(out/(pid+'-UNREVIEWED-proposal.jpg'),quality=90)
                  row['status']='source_and_crop_proposal_ready_for_human_review'
              except Exception as e:
                  row['status']='failed';row['error']=repr(e)
              report.append(row)
              print(pid,name,row['status'],flush=True)
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          if not any(r['status'].startswith('source_and') for r in report):raise SystemExit('No original photos could be downloaded')
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: expansion-two-portrait-human-review
          path: portrait-review/
          retention-days: 14
