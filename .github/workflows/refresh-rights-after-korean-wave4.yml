name: Refresh rights metadata audit after Korean wave 4
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-rights-after-korean-wave4.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quiz-rights-inventory-refresh
  cancel-in-progress: false
jobs:
  audit-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild exact rights inventory from all live banks
        run: |
          python singer/expansion-1500/rights_audit.py --write --main-sha "$(git rev-parse HEAD)"
          python singer/expansion-1500/rights_audit.py --check
      - name: Commit regenerated metadata report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add singer/expansion-1500/rights-audit-20261031.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh rights metadata report for new Korean celebrities"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
