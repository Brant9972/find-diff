name: Verify 1000-person celebrity release
on:
  push:
    branches: [expansion-1000-media-20261022, main]
    paths:
      - singer/expansion-1000-release.json
      - singer/game.js
      - singer/qa.cjs
      - singer/live-qa.cjs
      - .github/workflows/expansion1000-qa.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save puppeteer-core
      - run: python singer/prepare_hints.py
      - name: Check release count and preserve all prior questions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('singer')
          release=json.loads((r/'expansion-1000-release.json').read_text())
          banks=[json.loads((r/f).read_text()) for f in ['questions.json','actors.json','variety.json','creators.json']]
          allq={q['id']:q for b in banks for q in b['questions']}
          quarantined={q['id']:q for b in banks for q in b.get('quarantined',[])}
          assert len(allq)>=1000
          assert len(release['entries'])==411
          assert not (set(allq)&set(quarantined)), 'Quarantined portrait is still playable'
          all_preserved={**allq,**quarantined}
          release_ids={q['id'] for q in release['entries']}
          assert len(release_ids)==411
          batch_ids={q['id'] for q in all_preserved.values() if q.get('batchId')=='expansion1000_20261022'}
          assert batch_ids<=release_ids, 'Unrecorded expansion-1000 additions'
          # Historical editorial removals: misidentified 管罄 portrait and two Hong Kong drama exclusions.
          previously_retired={'x1000_p0107','x1000_p0384','x1000_p0548'}
          missing=release_ids-batch_ids
          assert missing<=previously_retired, f'Unexpected missing expansion-1000 records: {missing}'
          assert all(q.get('humanReviewed') for q in allq.values() if q.get('batchId')=='expansion1000_20261022')
          assert all(q.get('eligibleForLive') is False for q in quarantined.values())
          print(f'PASS: 411 historically recorded, {len(batch_ids)} playable/quarantined, {len(missing)} previously retired; {len(allq)} playable total')
          PY
      - run: node singer/qa.cjs
      - name: Verify the deployed public game
        if: github.ref == 'refs/heads/main'
        run: node singer/live-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: celebrity-release-qa
          path: qa-output
