name: Prepare remaining forty replacement portraits
on:
  push:
    branches: [main]
    paths: [singer/tools/prepare_remaining_forty.py, .github/workflows/remaining-forty.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests Pillow numpy==2.2.6 opencv-python-headless==4.12.0.88 opencc-python-reimplemented
      - run: python -u singer/tools/prepare_remaining_forty.py
      - name: Save replacement portraits for visual review
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add singer/actor-replacements-pending-40
          if ! git diff --cached --quiet; then
            git commit -m "Save remaining forty replacement portrait candidates"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
