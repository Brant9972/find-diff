name: Complete remaining K-pop A portraits
on:
  push:
    paths:
      - '.github/workflows/complete-kpop-a-group.yml'
permissions:
  contents: write
concurrency:
  group: kpop-a-group-completion
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==11.3.0 opencv-python-headless==4.11.0.86
      - name: Verify Commons rights and identities, crop faces, append verified entries
        shell: bash
        run: |
          python - <<'PY'
          import json,io,re,time,html,pathlib,urllib.parse,urllib.request,urllib.error,unicodedata
          from PIL import Image,ImageOps
          import cv2,numpy as np
          root=pathlib.Path('singer')
          people=[
            ('gd','G-DRAGON',['G-DRAGON','G-Dragon','權志龍','权志龙','Kwon Ji-yong','G-Dragon (BIGBANG)'],'File:G-DRAGON CHANEL Photo Call 1.jpg','G-DRAGON — BIGBANG'),
            ('jennie','Jennie',['Jennie','JENNIE','金珍妮','Kim Jennie','Jennie Kim','김제니'],'File:Jennie Kim 2024 (facecrop).png','Jennie — BLACKPINK'),
            ('lisa','Lisa',['Lisa','LISA','Lalisa','Lalisa Manobal','ลลิษา มโนบาล','麗莎','莉莎'],'File:Blackpink Lisa GMP 240622.png','Lisa — BLACKPINK'),
            ('rose','Rosé',['Rosé','ROSÉ','Rose','朴彩英','Park Chae-young','Roseanne Park','彩英'],'File:Blackpink Rosé Rimowa 1.jpg','Rosé — BLACKPINK'),
            ('jisoo','Jisoo',['Jisoo','JISOO','金智秀','Kim Ji-soo','Kim Jisoo','智秀'],'File:20240226 Kim Jisoo 김지수 02.jpg','Jisoo — BLACKPINK'),
            ('jungkook','田柾國',['田柾國','田柾国','Jungkook','Jung Kook','Jeon Jung-kook','JK','정국'],'File:Jung Kook of BTS, February 12, 2026 (6).png','田柾國 — BTS'),
            ('wonyoung','張員瑛',['張員瑛','張元英','张员瑛','Jang Won-young','Jang Wonyoung','Wonyoung','장원영'],'File:Jang Won-young of Ive, October 15, 2025 (2).png','張員瑛 — IVE'),
            ('tzuyu','周子瑜',['周子瑜','子瑜','Tzuyu','Chou Tzuyu','Chou Tzu-yu','쯔위'],'File:260618 Chou Tzuyu.png','周子瑜 — TWICE'),
            ('taeyeon','太妍',['太妍','金泰妍','Taeyeon','Tae-yeon','Kim Tae-yeon','태연'],'File:240512 소녀시대 태연 Taeyeon (cropped).jpg','太妍 — 少女時代'),
            ('psy','PSY',['PSY','Psy','朴載相','朴载相','Park Jae-sang','싸이','江南大叔'],'File:Psy without sunglasses.jpg','PSY — Gangnam Style')
          ]
          def norm(s):return re.sub(r'[\W_]+','',unicodedata.normalize('NFKC',s).casefold())
          allbank=[]
          for f in ['questions.json','actors.json','variety.json']:
              data=json.loads((root/f).read_text(encoding='utf-8'))
              allbank+=data['questions']
          names={norm(n) for q in allbank for n in [q['name']]+q.get('aliases',[])}
          people=[x for x in people if not any(norm(n) in names for n in x[2])]
          print('REMAINING',len(people),[x[1] for x in people],flush=True)
          if not people:raise RuntimeError('No remaining A-group members')
          def api(params):
              url='https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode(params)
              for attempt in range(8):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'FindDiffKpopARelease/1.0 (github.com/Brant9972/find-diff)'})
                      with urllib.request.urlopen(req,timeout=45) as f:return json.load(f)
                  except urllib.error.HTTPError as e:
                      if e.code not in (429,502,503,504) or attempt==7:raise
                      delay=min(60,5*(attempt+1))
                      print('API RETRY',e.code,delay,flush=True);time.sleep(delay)
          pages=api(dict(action='query',format='json',prop='imageinfo',iiprop='url|size|mime|extmetadata',titles='|'.join(x[3] for x in people)))
          bytitle={p['title']:p for p in pages['query']['pages'].values()}
          face=cv2.CascadeClassifier(cv2.data.haarcascades+'haarcascade_frontalface_default.xml')
          if face.empty():raise RuntimeError('Missing face cascade')
          created=[]
          records=[]
          for slug,name,aliases,title,bio in people:
              p=bytitle.get(title)
              if not p or 'imageinfo' not in p:
                  print('SKIP missing Commons file',name,title,flush=True);continue
              info=p['imageinfo'][0];meta=info.get('extmetadata',{})
              license=meta.get('LicenseShortName',{}).get('value','')
              if not (license.startswith('CC BY ') or license.startswith('CC BY-SA ') or license in ('CC0','Public domain')):
                  print('SKIP license',name,license,flush=True);continue
              if not info.get('mime','').startswith('image/') or info.get('width',0)<330 or info.get('height',0)<330:
                  print('SKIP dimensions',name,flush=True);continue
              req=urllib.request.Request(info['url'],headers={'User-Agent':'FindDiffKpopARelease/1.0'})
              try:
                  raw=None
                  for attempt in range(7):
                      try:
                          with urllib.request.urlopen(req,timeout=90) as f:raw=f.read(16000000)
                          break
                      except urllib.error.HTTPError as e:
                          if e.code not in (429,502,503,504) or attempt==6:raise
                          delay=min(90,20*(attempt+1))
                          print('IMAGE RETRY',name,e.code,delay,flush=True)
                          time.sleep(delay)
                  assert raw
                  im=ImageOps.exif_transpose(Image.open(io.BytesIO(raw))).convert('RGB')
                  im.thumbnail((1800,2200),Image.Resampling.LANCZOS)
                  w,h=im.size
                  gray=cv2.cvtColor(np.array(im),cv2.COLOR_RGB2GRAY)
                  faces=face.detectMultiScale(gray,scaleFactor=1.07,minNeighbors=5,minSize=(55,55))
                  candidates=sorted(faces,key=lambda a:a[2]*a[3],reverse=True)
                  if not candidates:
                      print('SKIP no verified face geometry',name,title,flush=True);continue
                  fx,fy,fw,fh=map(int,candidates[0])
                  if len(candidates)>1 and candidates[1][2]*candidates[1][3] > fw*fh*.65:
                      print('SKIP multiple prominent faces',name,flush=True);continue
                  # Portrait frame with ample forehead, chin, hair margins; clip to image.
                  cropw=min(w,max(int(fw*2.1),int(fh*1.5)))
                  croph=min(h,max(int(fh*2.6),int(cropw*1.22)))
                  cx=fx+fw*.5;cy=fy+fh*.63
                  left=max(0,min(w-cropw,int(cx-cropw/2)))
                  top=max(0,min(h-croph,int(cy-croph*.46)))
                  im=im.crop((left,top,left+cropw,top+croph))
                  im.thumbnail((800,1050),Image.Resampling.LANCZOS)
                  ey=(fy+fh*.34-top)/croph
                  nx=(fx+fw*.5-left)/cropw
                  x1=max(0,round(nx-.28,4));x2=min(1,round(nx+.28,4))
                  y1=max(0,round(ey-.065,4))
                  bottoms=[min(1,round(ey+d,4)) for d in (.065,.18,.30,.47)]
                  if not (0<y1<bottoms[0]<bottoms[1]<bottoms[2]<bottoms[3]<=1):
                      print('SKIP invalid face framing',name,flush=True);continue
                  dest=root/'photos'/('kr_a_20261109_'+slug+'.jpg')
                  im.save(dest,format='JPEG',quality=90,optimize=True)
                  artist=re.sub(r'<[^>]*>','',html.unescape(meta.get('Artist',{}).get('value',''))).strip()
                  if not artist:artist='See Wikimedia Commons source'
                  page='https://commons.wikimedia.org/wiki/'+urllib.parse.quote(title.replace(' ','_'),safe=':/()')
                  licurl=meta.get('LicenseUrl',{}).get('value','') or 'https://creativecommons.org/licenses/'
                  entry={'id':'kr_a_20261109_'+slug,'name':name,'aliases':aliases,'photo':'photos/'+dest.name,
                    'reveal':{'eyes':[x1,y1,x2,bottoms[0]],'nose':[x1,y1,x2,bottoms[1]],'mouth':[x1,y1,x2,bottoms[2]],'chin':[x1,y1,x2,bottoms[3]],'full':[0,0,1,1]},
                    'processorVersion':2,'photoStatus':'automatic_landmark_checks_passed','humanReviewed':False,
                    'eligibleForLive':True,'eligibility':'approved',
                    'attribution':{'article':'','source':page,'artist':artist[:300],'credit':title[5:]+' — '+artist[:200],'license':license,'licenseUrl':licurl,'attribution':artist[:300]},
                    'bioExcerpt':bio,'batchId':'kpop-a-20261109','transform':'Face-centered crop from licensed Wikimedia Commons file, resized JPEG; progressive reveals recomputed from detected face geometry'}
                  created.append(str(dest));records.append(entry)
                  time.sleep(8)
                  print('PASS',name,'source',title,'license',license,'image',im.size,'face',(fx,fy,fw,fh),'crop',(left,top,cropw,croph),'reveal',entry['reveal'],flush=True)
              except Exception as e:
                  print('SKIP image processing',name,type(e).__name__,str(e)[:200],flush=True)
          if not records:raise RuntimeError('No candidates passed portrait QA')
          bankfile=root/'questions.json'
          original=bankfile.read_text(encoding='utf-8')
          bank=json.loads(original)
          existingids={x['id'] for x in bank['questions']}
          assert not any(x['id'] in existingids for x in records)
          needle='\n  ],\n  "eligibilityReview":'
          assert original.count(needle)==1,'Unexpected singer JSON structure'
          added=',\n'+',\n'.join('    '+json.dumps(x,ensure_ascii=False,indent=2).replace('\n','\n    ') for x in records)
          result=original.replace(needle,added+needle,1)
          result=result.replace('"playable": '+str(bank['playable']),'"playable": '+str(bank['playable']+len(records)),1)
          final=json.loads(result)
          assert len(final['questions'])==len(bank['questions'])+len(records)==final['playable']
          assert final['questions'][:len(bank['questions'])]==bank['questions']
          bankfile.write_text(result,encoding='utf-8')
          pathlib.Path('/tmp/kpop_a_paths.txt').write_text('\n'.join(created),encoding='utf-8')
          print('RELEASE_COUNT',len(records),'OF',len(people),flush=True)
          print('RELEASE_NAMES',','.join(x['name'] for x in records),flush=True)
          PY
      - name: Commit only passing portraits and singer records
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add singer/questions.json
          while IFS= read -r p; do test -z "$p" || git add "$p"; done < /tmp/kpop_a_paths.txt
          git diff --cached --check
          git commit -m "feat(singer): add licensed K-pop A group portraits and clues"
          git pull --rebase origin main
          git push origin HEAD:main
