name: Expansion 1500 two verified-source portrait review
on:
  push:
    paths:
      - '.github/workflows/expansion-two-portrait-review.yml'
      - 'singer/expansion-1500/review-request.json'
  pull_request:
    paths:
      - '.github/workflows/expansion-two-portrait-review.yml'
  workflow_dispatch:
    inputs:
      person_id:
        description: 'Existing expansion-1500 candidate ID'
        required: true
        type: string
      person_name:
        description: 'Candidate name for the review report'
        required: true
        type: string
      commons_file:
        description: 'Exact Commons File: title, manually checked against candidate identity'
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - name: Validate workflow script syntax on push
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[portrait-review-request]'))
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/expansion-two-portrait-review.yml').read_text()
          lines = source.splitlines()
          marker = '      - name: Download exact Commons originals and prepare visual review'
          start = next(i for i, line in enumerate(lines) if line == marker)
          script_start = next(i for i in range(start + 1, len(lines)) if lines[i].startswith('          import json, pathlib, urllib.parse, urllib.request, re,'))
          script_end = next(i for i in range(script_start + 1, len(lines)) if lines[i] == '          PY')
          body = '\n'.join(line[10:] for line in lines[script_start:script_end])
          compile(body, '<portrait-review>', 'exec')
          print('Portrait review Python syntax PASS')
          PY
      - name: Download exact Commons originals and prepare visual review
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[portrait-review-request]'))
        env:
          PERSON_ID: ${{ inputs.person_id }}
          PERSON_NAME: ${{ inputs.person_name }}
          COMMONS_FILE: ${{ inputs.commons_file }}
        run: |
          python - <<'PY'
          import json, pathlib, urllib.parse, urllib.request, re, html, hashlib, io, os
          from PIL import Image,ImageOps,ImageDraw
          out=pathlib.Path('portrait-review');out.mkdir()
          if os.environ.get('PERSON_ID','').strip():
              entries=[(os.environ['PERSON_ID'],os.environ['PERSON_NAME'],os.environ['COMMONS_FILE'])]
          else:
              request_path=pathlib.Path('singer/expansion-1500/review-request.json')
              request=json.loads(request_path.read_text())
              if set(request)!={'person_id','person_name','commons_file'}: raise SystemExit('Unexpected review-request keys')
              entries=[(request['person_id'],request['person_name'],request['commons_file'])]
          if not all(isinstance(v,str) and v.strip() for v in entries[0]): raise SystemExit('Missing review inputs')
          if not re.fullmatch(r't1500_\d{4}', entries[0][0]): raise SystemExit('Invalid expansion ID')
          if not entries[0][2].startswith('File:'): raise SystemExit('Expected exact Commons File: title')
          # Refuse fabricated IDs, name mismatches, and already-published targets.
          plan=json.loads(pathlib.Path('singer/expansion-1500/release-plan-20261028.json').read_text())
          candidates={c['plannedQuestionId']:c for c in plan['selectedNew']}
          candidate=candidates.get(entries[0][0])
          if not candidate: raise SystemExit('Candidate ID absent from selectedNew')
          if candidate['name'] != entries[0][1].strip(): raise SystemExit('Candidate ID/name mismatch with release plan')
          if candidate.get('photoStatus') == 'published': raise SystemExit('Candidate already marked published in release plan')
          for bank in ('questions.json','actors.json','variety.json'):
              live=json.loads((pathlib.Path('singer')/bank).read_text())
              records=live if isinstance(live,list) else live.get('questions',live.get('people',[]))
              candidate_names={candidate['name'],*candidate.get('aliases',[]),*candidate.get('acceptedAnswers',[])}
              candidate_names={str(n).strip().casefold() for n in candidate_names if str(n).strip()}
              for p in records:
                  if not isinstance(p,dict): continue
                  if p.get('id')==entries[0][0]: raise SystemExit('Candidate ID already live in '+bank)
                  live_names={p.get('name',''),*(p.get('aliases') or []),*(p.get('acceptedAnswers') or [])}
                  live_names={str(n).strip().casefold() for n in live_names if str(n).strip()}
                  candidate_qid=candidate.get('wikidataId') or candidate.get('wikidataQid')
                  live_qid=p.get('wikidataId') or p.get('wikidataQid')
                  if candidate_qid and live_qid and str(candidate_qid).strip().upper()==str(live_qid).strip().upper():
                      raise SystemExit('Candidate Wikidata QID already live in '+bank+': '+str(candidate_qid))
                  if candidate_names & live_names:
                      raise SystemExit('Candidate name/alias already live in '+bank+': '+', '.join(sorted(candidate_names & live_names)))
          report=[]
          for pid,name,title in entries:
              row={'id':pid,'name':name,'commonsTitle':title,'approved':False}
              try:
                  url='https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode({'action':'query','format':'json','prop':'imageinfo','iiprop':'url|size|mime|extmetadata','titles':title})
                  headers={'User-Agent':'FindDiffPortraitReview/1.0 (github.com/Brant9972/find-diff; license and visual audit)'}
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=35) as response:data=json.load(response)
                  page=next(iter(data['query']['pages'].values()))
                  info=page['imageinfo'][0]
                  ext=info.get('extmetadata',{})
                  clean=lambda k:re.sub('<[^>]+>',' ',html.unescape(ext.get(k,{}).get('value',''))).strip()
                  for key in ['LicenseShortName','LicenseUrl','Artist','Credit','ImageDescription','ObjectName','UsageTerms','AttributionRequired']:
                      row[key]=clean(key)
                  # Reject clearly non-reusable licenses before downloading bytes.
                  # Metadata alone never constitutes identity or visual approval.
                  license_name=row.get('LicenseShortName','').strip().lower().replace(' ','')
                  # Full-match only: cc-by-nc, cc-by-nd and cc-by-sa-nc must never pass.
                  allowed_pattern=r'(?:ccby(?:-sa)?(?:[1-4]\.0)?|cc0(?:1\.0)?|publicdomain)'
                  if not re.fullmatch(allowed_pattern,license_name):
                      raise ValueError('License not on Commons reusable allowlist: '+row.get('LicenseShortName',''))
                  if not row.get('Artist','').strip():
                      raise ValueError('Missing Commons artist attribution')
                  row['sourceUrl']=info['url']
                  row['commonsPage']='https://commons.wikimedia.org/wiki/'+urllib.parse.quote(title.replace(' ','_'))
                  with urllib.request.urlopen(urllib.request.Request(info['url'],headers=headers),timeout=50) as response: raw=response.read(18_000_000)
                  row['sha256']=hashlib.sha256(raw).hexdigest()
                  image=Image.open(io.BytesIO(raw));image.load()
                  row['originalSize']=list(image.size)
                  image=ImageOps.exif_transpose(image).convert('RGB')
                  image.thumbnail((900,1080))
                  image.save(out/(pid+'-source.jpg'),quality=88)
                  # CENTER crop is only a review proposal, never an approved game image
                  original=ImageOps.exif_transpose(Image.open(io.BytesIO(raw))).convert('RGB')
                  proposal=ImageOps.fit(original,(600,720),method=Image.Resampling.LANCZOS,centering=(.5,.4))
                  proposal.save(out/(pid+'-UNREVIEWED-proposal.jpg'),quality=90)
                  row['status']='source_and_crop_proposal_ready_for_human_review'
              except Exception as e:
                  row['status']='failed';row['error']=repr(e)
              report.append(row)
              print(pid,name,row['status'],flush=True)
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          if not any(r['status'].startswith('source_and') for r in report):raise SystemExit('No original photos could be downloaded')
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[portrait-review-request]'))
        with:
          name: expansion-two-portrait-human-review
          path: portrait-review/
          retention-days: 14
