function setText(){ $('lv').textContent=String(current+1).padStart(3,'0')+' / 100';$('found').textContent=found.size+' / 5';$('time').textContent=seconds;$('bar').style.width=found.size*20+'%';$('title').textContent=themes[active.theme].title+' · Lv.'+(current+1);$('hintBtn').textContent=`💡 提示（${hints}）`; }
function render(){['A','B'].forEach((name,side)=>{const el=$('scene'+name);el.innerHTML=svg(current,side)+'<div class="spots" id="spots'+name+'"></div>';el.onclick=e=>{if(!playing)return;const b=el.getBoundingClientRect();const x=(e.clientX-b.left)/b.width*400,y=(e.clientY-b.top)/b.height*230; tap(x,y,el)};for(const i of found)addRing(i,name)});setText()}
function addRing(i,side,hint=false){const d=active.objects[i],el=$('spots'+side);if(!el)return;const r=document.createElement('div');r.className='ring'+(hint?' hintRing':'');r.style.left=d.x/4+'%';r.style.top=d.y/230*100+'%';if(!hint)r.dataset.mark=i;el.append(r);if(hint)setTimeout(()=>r.remove(),1200)}
function tap(x,y,el){let nearest=-1,dist=1e9;active.objects.forEach((d,i)=>{if(found.has(i))return;let m=Math.hypot(x-d.x,y-d.y);if(m<dist){nearest=i;dist=m}});if(nearest!==-1&&dist<Math.max(15,24-current*.07)){found.add(nearest);addRing(nearest,'A');addRing(nearest,'B');beep(660,0.09);$('msg').textContent=['好眼力！','漂亮！再找一個！','抓到了！','剩最後一個！','全部找到了！'][found.size-1];setText();if(found.size===5){playing=false;clearInterval(timer);setTimeout(win,650)}}else{seconds=Math.max(0,seconds-4);incorrect++;$('msg').textContent='哎呀，這裡一樣！扣 4 秒';el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');beep(180,.1);setText();if(seconds===0)lose()}}
let audio=null;function beep(freq=550,dur=.08){try{audio??=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.06,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function loop(){clearInterval(timer);timer=setInterval(()=>{if(!playing)return;seconds--;setText();if(seconds<=0)lose()},1000)}
function load(lv){current=lv;found=new Set();active=makeLevel(lv);seconds=Math.max(42,100-Math.floor(lv*.58));hints=lv<20?3:lv<50?2:lv<75?1:0;incorrect=0;playing=true;$('msg').textContent='找出所有不同！';$modal.hidden=true;render();loop()}
function show(emoji,title,desc,action,secondary='',onSecond=null){playing=false;clearInterval(timer);$('modalEmoji').textContent=emoji;$('modalTitle').textContent=title;$('modalText').innerHTML=desc;$('levelPicker').hidden=true;$('modalMain').textContent=action.text;$('modalMain').onclick=action.fn;$('modalSecond').hidden=!secondary;if(secondary){$('modalSecond').textContent=secondary;$('modalSecond').onclick=onSecond}$modal.hidden=false}
function win(){beep(850,.25);let stars=seconds>=58&&hints===3?'⭐⭐⭐':seconds>=20?'⭐⭐':'⭐';best[current]=Math.max(best[current]||0,stars.length/2);unlocked=Math.max(unlocked,Math.min(TOTAL,current+2));try{localStorage.setItem('eye_unlocked',unlocked);localStorage.setItem('eye_best',JSON.stringify(best))}catch(e){}let done=current===99;show(done?'🏆':'🎉',done?'百關全破！':'第 '+(current+1)+' 關完成！',`<div style="font-size:28px;margin-bottom:8px">${stars}</div>剩餘 <b>${seconds}</b> 秒，點錯 <b>${incorrect}</b> 次。<br>${done?'你就是眼力王！可以重玩挑戰三星！':'再來一關？下一張圖等你挑戰！'}`,{text:done?'回到第 1 關':'下一關 →',fn:()=>load(done?0:current+1)},'選擇關卡',picker)}
function lose(){beep(150,.24);show('⏰','時間到！',`差一點！你已找到 ${found.size} / 5 處不同。<br>同一關再試一次，就會更快發現！`,{text:'↻ 重新挑戰',fn:()=>load(current)},'選擇關卡',picker)}
function picker(){show('🗺️','關卡地圖','已解鎖的關卡可以隨時重玩。',{text:'返回遊戲',fn:()=>load(current)});const p=$('levelPicker');p.hidden=false;p.innerHTML='';for(let i=0;i<TOTAL;i++){let b=document.createElement('button');b.textContent=i<unlocked?String(i+1):'🔒';if(i===current)b.classList.add('active');if(i>=unlocked)b.classList.add('locked');b.disabled=i>=unlocked;b.onclick=()=>load(i);p.append(b)}}
$('levelsBtn').onclick=picker;$('hintBtn').onclick=()=>{if(!playing||hints<=0)return;let i=active.objects.findIndex((_,i)=>!found.has(i));if(i<0)return;hints--;addRing(i,'A',true);addRing(i,'B',true);$('msg').textContent='黃色光圈就是線索！';setText()};$('retryBtn').onclick=()=>load(current);$('pauseBtn').onclick=()=>{if(!playing)return;show('⏸️','已暫停','眼睛休息一下，時間不會繼續倒數。',{text:'繼續挑戰',fn:()=>{$modal.hidden=true;playing=true;loop()}},'重新開始',()=>load(current))};document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)$('pauseBtn').click()});active=makeLevel(0);render();show('👀','眼力特搜隊','每關有 <b>5 個不同點</b>！<br>上下兩張圖，<b>點任一張</b>都能找。<br>點錯扣 4 秒，提示每關可用 3 次。<br><b>共有 100 關，越往後越難！</b>',{text:'開始第 1 關 →',fn:()=>load(0)},unlocked>1?'繼續上次進度':'',unlocked>1?()=>load(unlocked-1):null);
</script></body></html>
