name: Verify work hints
on:
  push:
    paths:
      - 'singer/hint-candidates.json'
      - 'singer/prepare_hints.py'
      - 'singer/hints.json'
      - '.github/workflows/work-hints.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quiz-work-hints
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python singer/prepare_hints.py
