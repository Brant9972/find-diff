name: Stage actor portrait sources
on:
  push:
    branches: [actor-refresh-20261021]
    paths:
      - "singer/tools/fetch_actor_media.py"
      - ".github/workflows/stage-actor-portraits.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: actor-refresh-20261021
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install portrait processing tools
        run: pip install --disable-pip-version-check requests Pillow numpy opencv-python-headless
      - name: Download public-license portrait candidates
        run: python singer/tools/fetch_actor_media.py
      - uses: actions/upload-artifact@v4
        with:
          name: actor-photo-staging
          path: singer/actor-roster-staging/
          if-no-files-found: warn
      - name: Save staged portraits on the review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add singer/actor-roster-staging/
          if git diff --cached --quiet; then
            echo "No staged changes"
          else
            git commit -m "Stage Wikimedia actor portrait candidates for human review"
            git push origin HEAD:actor-refresh-20261021
          fi
