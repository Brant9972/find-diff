name: Expansion 1500 Wikidata P18 portrait source probe
on:
  push:
    paths:
      - '.github/workflows/expansion-p18-source-probe.yml'
  pull_request:
    paths:
      - '.github/workflows/expansion-p18-source-probe.yml'
  workflow_dispatch:
    inputs:
      offset:
        description: 'Skip this many unpublished candidates (avoid repeating the first batch)'
        required: false
        default: '12'
      limit:
        description: 'Number of candidates to probe (1-25)'
        required: false
        default: '12'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Probe unpublished planned people using Wikidata P18 and Commons metadata
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request, urllib.parse, urllib.error, time, re, html
          root=pathlib.Path('singer')
          plan=json.loads((root/'expansion-1500/release-plan-20261028.json').read_text())
          live=[]
          for f in ('questions.json','actors.json','variety.json'):
              live+=json.loads((root/f).read_text())['questions']
          ids={str(p.get('id','')) for p in live}
          def norm(s): return re.sub(r'[\s·・.．_-]+','',str(s or '')).casefold()
          names={norm(n) for p in live for n in [p.get('name'), *(p.get('aliases') or [])] if isinstance(n,str) and n.strip()}
          seen=set()
          candidates=[]
          for p in plan['selectedNew']:
              key=norm(p.get('name'))
              pid=p.get('plannedQuestionId')
              if not key or key in names or key in seen or pid in ids or p.get('photoStatus')=='published': continue
              seen.add(key)
              candidates.append(p)
          offset=max(0,int('${{ inputs.offset || '12' }}'))
          limit=max(1,min(25,int('${{ inputs.limit || '12' }}')))
          candidates=candidates[offset:offset+limit]
          print('PROBE WINDOW',offset,limit,'eligible total',len(seen),flush=True)
          headers={'User-Agent':'FindDiffExpansionP18Probe/1.0 (github.com/Brant9972/find-diff; metadata-only)'}
          def api(host, params):
              url=host+'?'+urllib.parse.urlencode(params)
              for i in range(4):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=25) as r:
                          return json.load(r)
                  except (urllib.error.HTTPError,urllib.error.URLError,TimeoutError) as e:
                      if i==3: return {'error':str(e)}
                      time.sleep(3*(i+1))
          # Regression checks run on every probe before any remote lookup.
          def identity_gate(planned, labels, aliases, human_qids, occupations):
              planned_names={norm(v) for v in planned if isinstance(v,str) and v.strip()}
              entity_names={norm(v) for v in labels+aliases if isinstance(v,str) and v.strip()}
              if not (planned_names & entity_names): return 'name_or_alias_mismatch'
              if 'Q5' not in human_qids: return 'not_confirmed_human'
              relevant={'Q177220','Q33999','Q49757','Q483501','Q639669','Q488205','Q2526255','Q10800557','Q2405480','Q2252262'}
              if not (set(occupations) & relevant): return 'occupation_not_confirmed'
              return None
          assert identity_gate(['家家'],['家家美食'],[],{'Q5'},['Q177220'])=='name_or_alias_mismatch'
          assert identity_gate(['黃玠'],['黃玠瑋'],[],{'Q5'},['Q177220'])=='name_or_alias_mismatch'
          assert identity_gate(['喜翔'],['Jason King'],[],{'Q5'},['Q33999'])=='name_or_alias_mismatch'
          assert identity_gate(['家家'],['家家'],[],{'Q41176'},['Q177220'])=='not_confirmed_human'
          assert identity_gate(['王瞳'],['王瞳'],[],{'Q5'},[])=='occupation_not_confirmed'
          assert identity_gate(['王瞳'],['王瞳'],[],{'Q5'},['Q33999']) is None
          assert identity_gate(['黃智賢'],['Ben Wong'],['黃智賢'],{'Q5'},['Q33999']) is None
          print('IDENTITY GATE REGRESSION PASS',flush=True)
          report=[]
          for p in candidates:
              name=p['name']
              row={'id':p['plannedQuestionId'],'name':name,'status':'unverified','candidates':[]}
              search=api('https://www.wikidata.org/w/api.php',dict(action='wbsearchentities',search=name,language='zh',uselang='zh',format='json',limit=5))
              row['rejectedEntities']=[]
              for hit in search.get('search',[]):
                  qid=hit['id']
                  entity=api('https://www.wikidata.org/w/api.php',dict(action='wbgetentities',ids=qid,props='claims|labels|descriptions|aliases',languages='zh|en|zh-hant|zh-hans',format='json'))
                  e=entity.get('entities',{}).get(qid,{})
                  occupation=[x.get('mainsnak',{}).get('datavalue',{}).get('value',{}).get('id') for x in e.get('claims',{}).get('P106',[])]
                  # Require an exact full-name/alias match, never substring matching.
                  # A P18 is only a source candidate, not identity or license approval.
                  labels=[v.get('value','') for v in e.get('labels',{}).values()]
                  aliases=[a.get('value','') for values in e.get('aliases',{}).values() for a in values]
                  reason=identity_gate([name,*(p.get('aliases') or [])],labels,aliases,{x.get('mainsnak',{}).get('datavalue',{}).get('value',{}).get('id') for x in e.get('claims',{}).get('P31',[])},occupation)
                  if reason:
                      row['rejectedEntities'].append({'qid':qid,'reason':reason,'occupationQids':occupation})
                      continue
                  for claim in e.get('claims',{}).get('P18',[])[:2]:
                      title=claim.get('mainsnak',{}).get('datavalue',{}).get('value')
                      if not isinstance(title,str):continue
                      commons=api('https://commons.wikimedia.org/w/api.php',dict(action='query',format='json',prop='imageinfo',iiprop='url|size|mime|extmetadata',titles='File:'+title))
                      pages=commons.get('query',{}).get('pages',{})
                      info=next((v['imageinfo'][0] for v in pages.values() if v.get('imageinfo')),None)
                      if not info:continue
                      m=info.get('extmetadata',{})
                      get=lambda key:re.sub('<[^>]*>',' ',html.unescape(m.get(key,{}).get('value',''))).strip()[:600]
                      row['candidates'].append({'qid':qid,'wikidataDescription':hit.get('description',''),'occupationQids':occupation,'commonsTitle':title,'commonsPage':'https://commons.wikimedia.org/wiki/File:'+urllib.parse.quote(title.replace(' ','_')),'license':get('LicenseShortName'),'licenseUrl':get('LicenseUrl'),'artist':get('Artist'),'credit':get('Credit'),'usageTerms':get('UsageTerms'),'mime':info.get('mime'),'width':info.get('width'),'height':info.get('height'),'sourceUrl':info.get('url'),'warning':'NOT identity/rights/crop approved; manual verification mandatory'})
              row['status']='metadata_candidates_only' if row['candidates'] else 'no_verified_p18_source'
              report.append(row)
              print(row['id'],name,row['status'],len(row['candidates']),flush=True)
          out=pathlib.Path('p18-source-probe.json')
          out.write_text(json.dumps({'mainCommit':'${{ github.sha }}','offset':offset,'limit':limit,'entries':report,'note':'Metadata only. No photo or person is approved; cross-bank alias/QID, source caption, rights and five-stage manual review required.'},ensure_ascii=False,indent=2))
          print('PROBE SUMMARY',json.dumps({'people':len(report),'withP18':sum(bool(r['candidates']) for r in report)},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: expansion-p18-source-probe
          path: p18-source-probe.json
          retention-days: 14
