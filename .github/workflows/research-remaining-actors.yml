name: Research remaining actor portraits
on:
  push:
    branches: [actor-refresh-20261021]
    paths:
      - singer/tools/research_remaining_actor_media.py
      - .github/workflows/research-remaining-actors.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: actor-refresh-20261021
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests Pillow 'numpy<2' opencv-python-headless==4.10.0.84
      - name: Search publicly licensed portrait candidates
        run: python singer/tools/research_remaining_actor_media.py
      - uses: actions/upload-artifact@v4
        with:
          name: actor-portrait-review-options
          path: singer/actor-roster-staging-extra/
          if-no-files-found: warn
      - name: Store candidates on review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add singer/actor-roster-staging-extra/
          if git diff --cached --quiet; then
            echo "No new candidates"
          else
            git commit -m "Stage alternative open-license portrait options for actor review"
            git push origin HEAD:actor-refresh-20261021
          fi
