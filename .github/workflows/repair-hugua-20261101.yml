name: Build Hu Gua Wikimedia photo for visual review
on:
  push:
    branches:
      - fix/hu-gua-portrait-20261101
    paths:
      - .github/workflows/repair-hugua-20261101.yml
      - singer/tools/repair_hugua_20261101.py
permissions:
  contents: write
jobs:
  build-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image-processing dependencies
        run: python -m pip install --quiet requests Pillow numpy opencv-python-headless
      - name: Download Commons portrait, detect face and produce review images
        run: python singer/tools/repair_hugua_20261101.py
      - name: Save candidate assets to review branch only
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add singer/variety.json singer/photos/x1000_p0274_commons_2010.jpg singer/expansion-1500/portrait-fixes/hu-gua-review-20261101.jpg singer/expansion-1500/portrait-fixes/hu-gua-audit-20261101.json
          git diff --cached --check
          git commit -m "Stage Hu Gua Wikimedia portrait for manual crop and identity-source review"
          git push origin HEAD:fix/hu-gua-portrait-20261101
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hu-gua-portrait-audit
          path: |
            singer/expansion-1500/portrait-fixes/hu-gua-review-20261101.jpg
            singer/expansion-1500/portrait-fixes/hu-gua-audit-20261101.json
          if-no-files-found: warn
