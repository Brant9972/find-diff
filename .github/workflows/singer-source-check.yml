name: Singer photo source connectivity
on:
  push:
    paths:
      - '.github/workflows/singer-source-check.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check public photo APIs without retries
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          from pathlib import Path
          def api(host, **kw):
              url="https://"+host+"/w/api.php?"+urllib.parse.urlencode({"action":"query","format":"json","formatversion":2,**kw})
              req=urllib.request.Request(url,headers={"User-Agent":"SingerFaceQuiz/1.0 (https://github.com/Brant9972/find-diff)"})
              with urllib.request.urlopen(req,timeout=15) as res: return json.load(res)
          report=[]
          for host,title in [("zh.wikipedia.org","林俊傑"),("en.wikipedia.org","JJ Lin"),("zh.wikipedia.org","陶喆"),("en.wikipedia.org","David Tao")]:
              row={"host":host,"title":title}
              try:
                  result=api(host,titles=title,redirects=1,converttitles=1,prop="pageimages|pageprops|extracts|info",piprop="name|thumbnail",pilicense="free",pithumbsize=1200,exintro=1,explaintext=1,inprop="url")
                  row["page"]=result
                  page=result.get("query",{}).get("pages",[{}])[0]
                  if page.get("pageimage"):
                      row["file"]=api(host,titles="File:"+page["pageimage"],prop="imageinfo",iiprop="url|extmetadata",iiurlwidth=1200)
              except Exception as exc: row["error"]=str(exc)
              report.append(row)
          Path("singer/source-diagnostic.json").write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Save connectivity result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add singer/source-diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "Record photo source connectivity diagnostics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
