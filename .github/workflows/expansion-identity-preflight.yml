name: Expansion identity preflight tests
on:
  pull_request:
    paths:
      - 'singer/expansion-1500/identity_preflight.py'
      - 'singer/expansion-1500/test_identity_preflight.py'
      - '.github/workflows/expansion-identity-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact-identity regression tests
        run: python -m unittest discover -s singer/expansion-1500 -p 'test_identity_preflight.py' -v
