name: Prepare 1500 roster licensed portrait drafts (review only)
on:
  push:
    branches:
      - release-1500-media-20261028
    paths:
      - 'singer/expansion-1500/prepare_media.py'
      - '.github/workflows/expansion1500-draft-media.yml'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of next candidate portraits to draft (max 100)'
        required: false
        default: '100'
permissions:
  contents: write
concurrency:
  group: staged-1500-media
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-1500-media-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata and face-crop dependencies
        run: python -m pip install requests Pillow numpy==2.2.6 opencv-python-headless==4.12.0.88 opencc-python-reimplemented
      - name: Prepare licensed draft candidates without touching live game
        run: python -u singer/expansion-1500/prepare_media.py --limit ${{ github.event.inputs.limit || '100' }}
      - name: Commit review candidates to staging branch only
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f singer/expansion-1500/draft-media-index.json ]; then
            git add singer/expansion-1500/draft-media-index.json singer/expansion-1500/review_photos
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Checkpoint unapproved 1500-person Wikimedia portrait drafts"
            git pull --rebase origin release-1500-media-20261028
            git push origin HEAD:release-1500-media-20261028
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expansion-1500-portrait-drafts
          path: |
            singer/expansion-1500/draft-media-index.json
            singer/expansion-1500/review_photos
          if-no-files-found: warn
