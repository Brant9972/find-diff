name: Singer live Pages QA
on:
  push:
    branches: [main]
    paths:
      - singer/live-qa-1100.cjs
      - .github/workflows/singer-live-qa.yml
      - singer/questions.json
      - singer/actors.json
      - singer/variety.json
      - singer/hints.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false puppeteer-core@24
      - run: node --check singer/live-qa-1100.cjs
      - run: node singer/live-qa-1100.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: singer-live-mobile-qa
          path: qa-output
