name: Stage reviewed Jade Kwan crop from pinned QA artifact (review branch only)
on:
  push:
    branches: [review/jade-kwan-20261103]
    paths: [.github/workflows/stage-jade-kwan-20261103.yml]
permissions:
  actions: read
  contents: write
concurrency:
  group: stage-jade-kwan-20261103
  cancel-in-progress: false
jobs:
  stage-reviewed-photo:
    if: github.ref == 'refs/heads/review/jade-kwan-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/jade-kwan-20261103
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: curated-jade-kwan-2019-unapproved-41505255147
          run-id: 41505255147
          repository: Brant9972/find-diff
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/jade
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - name: Verify pinned crop and stage photo on review branch only
        env:
          SOURCE_DIR: ${{ runner.temp }}/jade
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          from PIL import Image
          src = Path(os.environ["SOURCE_DIR"])
          manifest = json.loads((src / "manifest.json").read_text())
          assert manifest["personId"] == "t1500_0481"
          assert manifest["originalSha1Expected"] == "deedf1eae08b911b404149cad9c63d07cc32cf9b"
          assert manifest["status"] == "download_verified_provisional_crop_created"
          assert manifest["releaseGate"] == "DIAGNOSTIC_DRAFT_ONLY_NOT_APPROVED_NOT_PLAYABLE"
          assert not manifest["humanReviewed"] and not manifest["liveUpdated"]
          data = (src / "draft-600x720.jpg").read_bytes()
          assert hashlib.sha256(data).hexdigest() == "5e4368df870636c999e3acb36be7ca903d3746f38e9305dcc34c76b199adee70"
          with Image.open(src / "draft-600x720.jpg") as im:
              assert im.format == "JPEG" and im.size == (600, 720)
              im.verify()
          dst = Path("singer/photos/t1500_0481.jpg")
          assert not dst.exists(), "Never overwrite an existing game photo"
          shutil.copyfile(src / "draft-600x720.jpg", dst)
          print("STAGED_REVIEW_BRANCH_ONLY", dst)
          PY
      - name: Commit only staged JPEG to review branch (never main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- singer/photos/t1500_0481.jpg
          git commit -m "Stage SHA-verified Jade Kwan portrait for manual review only"
          git push origin HEAD:refs/heads/review/jade-kwan-20261103
