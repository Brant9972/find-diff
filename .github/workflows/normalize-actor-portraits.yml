name: Normalize reviewed actor portraits
on:
  push:
    branches: [actor-refresh-20261021]
    paths:
      - ".github/workflows/normalize-actor-portraits.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: actor-refresh-20261021
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow==11.3.0
      - name: Normalize to expected game portrait size
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          for p in sorted(Path('singer/actor-roster-staging/photos').glob('*.jpg')):
              src=Image.open(p).convert('RGB')
              if src.size == (600,720):
                  continue
              image=ImageOps.fit(src,(600,720),Image.Resampling.LANCZOS,centering=(0.5,0.45))
              image.save(p,quality=90,optimize=True)
              print(p,src.size,image.size)
          PY
      - name: Commit size fixes to isolated review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add singer/actor-roster-staging/photos
          if ! git diff --cached --quiet; then
            git commit -m "Normalize 11 staged portraits to game dimensions"
            git pull --rebase origin actor-refresh-20261021
            git push origin HEAD:actor-refresh-20261021
          fi
